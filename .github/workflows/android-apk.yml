name: Build Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Verify Android project is present
        run: |
          test -f android/gradlew || {
            echo 'The android/ folder is missing. Restore and commit it before building.'
            exit 1
          }

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Package application and icon fonts
        run: |
          mkdir -p android/app/src/main/assets/fonts
          cp node_modules/react-native-vector-icons/Fonts/*.ttf android/app/src/main/assets/fonts/
          if [ -d src/assets/fonts ]; then
            cp src/assets/fonts/*.ttf android/app/src/main/assets/fonts/ || true
          fi
          test -f android/app/src/main/assets/fonts/Ionicons.ttf
          test -f android/app/src/main/assets/fonts/MaterialCommunityIcons.ttf

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: eduma-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
